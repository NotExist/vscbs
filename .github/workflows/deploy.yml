name: 部署到 GitHub Pages

# 這裡刻意不抓 cbs.tw:它掛在 Cloudflare 後面,對 GitHub Actions 的 Azure 出口 IP
# 一律回 Managed Challenge(403 + cf-mitigated: challenge),換任何 User-Agent 都無效。
# 資料改由能連通的機器跑 scripts/mirror.sh 後 commit 進版本庫,CI 只負責發布。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 驗證解析與介面
        run: npm ci --silent && npm test

      - name: 組出站台
        run: |
          mkdir -p _site
          cp -r index.html assets vendor data _site/
          touch _site/.nojekyll
          du -sh _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
